name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The enhanced cache provider needs accepted terms and may not be free for private repos.
          cache-provider: basic

      - name: Build
        run: ./gradlew build --no-daemon

      # Headless game tests of every module (root task gameTests); a run's exit code is its failed required tests.
      - name: Game tests
        run: ./gradlew gameTests --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: mods
          path: '**/build/libs/*.jar'
