plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

// The run configurations below load sb_core from its source set, so it must be evaluated first.
evaluationDependsOn(':sb_core')

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

// Game tests live in their own source set as a tiny test-only mod (sb_combat_tests) that only the
// gameTestServer run loads, together with sb_core's; the shipped jar never contains them.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_tests" {
            sourceSet(sourceSets.gametest)
        }
        // Runs from this module load the core module too, straight from its sources.
        'sb_core' {
            sourceSet(project(':sb_core').sourceSets.main)
        }
        'sb_core_tests' {
            sourceSet(project(':sb_core').sourceSets.gametest)
        }
    }
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}", mods.sb_core]
        }
        // Animation contact sheets: joins the "New World" save, screenshots every frame of the listed
        // animations from behind, from the front and in first person, then quits (see AnimDebug).
        // Override the list with -Psb.animdebug=... on the command line.
        clientAnim {
            client()
            loadedMods = [mods."${mod_id}", mods.sb_core]
            programArguments.addAll '--quickPlaySingleplayer', 'Anim Capture', '--width', '1280', '--height', '720'
            systemProperty 'sb.animdebug', project.findProperty('sb.animdebug') ?: 'sb_combat:sword_sweep_ltr,sb_combat:sword_sweep_ltr_fp'
        }
        // A second client with its own username and folder, for two-player tests on one machine.
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'Dev2'
            loadedMods = [mods."${mod_id}", mods.sb_core]
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}", mods.sb_core]
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id}_tests,sb_core_tests"
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // JetBrains Runtime only: hot-swap added/removed methods and fields while the game runs.
            // Ignored (not fatal) on JDKs that do not know the flag.
            jvmArgument '-XX:+IgnoreUnrecognizedVMOptions'
            jvmArgument '-XX:+AllowEnhancedClassRedefinition'
        }
    }


    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Compile against core; at runtime the run configurations load it as a mod from its source set.
    compileOnly project(':sb_core')
    testCompileOnly project(':sb_core')
    gametestCompileOnly project(':sb_core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
