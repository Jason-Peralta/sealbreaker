plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    // Datagen output is committed and shipped.
    srcDir('src/generated/resources')
    // Development-only files never reach the jar.
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

// Game tests live in their own source set as a tiny test-only mod (sb_core_tests) that only the
// gameTestServer run loads; the shipped jar never contains them.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_tests" {
            sourceSet(sourceSets.gametest)
        }
    }
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        // Runs every registered game test headlessly, then exits. Crashes if no tests exist yet.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id}_tests"
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }


    // JUnit tests under src/test run inside a NeoForge bootstrap and may reference Minecraft classes.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// 'localRuntime' declares a dependency present at runtime for testing without publishing it as required.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // External mods are utilities only (decision 0015): JEI, Curios, GeckoLib when needed; none yet.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml) at build time.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
