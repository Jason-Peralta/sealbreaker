# Mod metadata. Dollar-brace placeholders are expanded by the generateModMetadata task from gradle.properties.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Sealbreaker team"
description='''
Shared API for the Sealbreaker modpack: Seals and progression state, character growth, data registries,
attributes, networking and datagen base classes. Contains no gameplay content.
'''

# The only Mixins in the project live in this module; each one states why no event could do the job.
[[mixins]]
config="sb_core.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
