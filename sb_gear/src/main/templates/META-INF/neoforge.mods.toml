# Mod metadata. Dollar-brace placeholders are expanded by the generateModMetadata task from gradle.properties.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Sealbreaker team"
description='''
Gear of the Sealbreaker modpack: weapons, armor, accessories, reforging and combining, rarity and coins.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sb_core"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sb_combat"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"
