plugins {
    id 'sealbreaker.mod'
}

// World reads Seal state and enemy hooks from core and combat (PRD section 6.2).
sealbreakerMod.dependsOnModules ':sb_core', ':sb_combat'

neoForge.runs {
    // Structure captures: creates a fresh world for the given seed, finds the nearest sb_world:spike structure,
    // teleports there, screenshots it and quits (see WorldDebug). Dev only.
    clientWorld {
        client()
        loadedMods.addAll(project.provider { sealbreakerMod.loadedMods })
        programArguments.addAll '--width', '1280', '--height', '720'
        systemProperty 'sb.worlddebug', project.findProperty('sb.worlddebug') ?: '1'
    }
    // Portal captures, two clients on one machine: the host creates a world, opens it to LAN and drives the test;
    // start it first, then the guest, which quick-plays to the LAN address (see PortalDebug). Dev only.
    clientPortal {
        client()
        loadedMods.addAll(project.provider { sealbreakerMod.loadedMods })
        programArguments.addAll '--width', '1280', '--height', '720'
        systemProperty 'sb.portaldebug', 'host:' + (project.findProperty('sb.portalseed') ?: '3') + (project.hasProperty('sb.portalsolo') ? ':solo' : '')
    }
    clientPortalGuest {
        client()
        loadedMods.addAll(project.provider { sealbreakerMod.loadedMods })
        gameDirectory = project.file('run/client2')
        programArguments.addAll '--username', 'Dev2', '--quickPlayMultiplayer', '127.0.0.1:25585', '--width', '1280', '--height', '720'
        systemProperty 'sb.portaldebug', 'guest'
    }
}
