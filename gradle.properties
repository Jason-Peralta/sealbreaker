# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment (see docs/01-research.md, section 1; bump only at milestone boundaries per docs/03-roadmap.md)
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.76
# ModDevGradle plugin version is declared in each module's build.gradle plugins block.

# Shared mod metadata. Per-module values (mod_id, mod_name) live in <module>/gradle.properties.
mod_version=0.0.1
mod_license=MIT
mod_group_id=dev.sealbreaker
